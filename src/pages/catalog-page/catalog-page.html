<main class="main">
  <div class="container">
    <div class="title-container">
      <h1 class="title">Каталог</h1>
      <create-product />
    </div>
    <div class="table-container">
      <tui-scrollbar class="table-scrollbar">
        <table class="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Цена</th>
              <th>НДС</th>
              <th class="actions">Действия</th>
            </tr>
          </thead>
          <tbody>
            @for (product of products(); track product.id) {
              <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}&nbsp;₽</td>
                <td>{{ product.vat }}%</td>
                <td class="actions">
                  <product-actions [product]="product" />
                </td>
              </tr>
            }
          </tbody>
        </table>
      </tui-scrollbar>
    </div>
  </div>
</main>
