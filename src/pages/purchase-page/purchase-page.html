<main class="main">
  <div class="container">
    <h1 class="title">Покупки</h1>
    <div class="table-container">
      <tui-scrollbar class="table-scrollbar">
        <table class="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Товары</th>
              <th>Логин покупателя</th>
              <th>Сумма покупки</th>
              <th>Дата операции</th>
            </tr>
          </thead>
          <tbody>
            @for (purchase of purchases(); track purchase.id) {
              <tr>
                <td>{{ purchase.id }}</td>
                <td>{{ purchase.productName }}</td>
                <td>{{ purchase.username }}</td>
                <td>{{ purchase.amount }}&nbsp;₽</td>
                <td>{{ purchase.date | date: 'dd.MM.yyyy' }}</td>
              </tr>
            }
          </tbody>
        </table>
      </tui-scrollbar>
    </div>
  </div>
</main>
